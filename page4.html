<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3 Months With You 💗 | Step 4</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .counter-card {
      background: rgba(26, 12, 34, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 133, 179, 0.3);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 77, 148, 0.2);
      text-align: center;
    }
    .love-percentage {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--gold-accent);
      margin: 14px 0;
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.4);
      font-family: 'Outfit', sans-serif;
    }
    .love-status {
      font-size: 0.95rem;
      color: var(--pink-glow);
      margin-bottom: 20px;
      min-height: 28px;
    }
    .btn-panic {
      background: rgba(255, 77, 148, 0.18);
      border: 1px solid var(--pink-primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-panic:active {
      transform: scale(0.95);
      background: rgba(255, 77, 148, 0.35);
    }
  </style>
</head>
<body>
  <div class="ambient-bg" id="petals"></div>

  <div class="container">
    <span class="page-badge">Chapter 04 • System Overload</span>
    <h1>Affan's Love Calculator 🧮💗</h1>
    <p class="subtitle">Warning: This system is built to calculate how much I love you, but it refuses to stop.</p>

    <div class="counter-card">
      <div style="font-size: 0.85rem; letter-spacing: 1.5px; color: #fff5f9; text-transform: uppercase;">Current Love Level</div>
      <div class="love-percentage" id="loveCounter">100.0%</div>
      <div class="love-status" id="loveStatus">Normal levels detected... wait, it's still climbing! 📈</div>
      
      <button class="btn-panic" onclick="boostLove()">🛑 Try to Stop / Pause</button>
    </div>
  </div>

  <div class="nav-footer">
    <a href="page5.html" class="btn-glow next-btn" id="nextBtn">Next Page →</a>
  </div>

  <script>
    const bg = document.getElementById('petals');
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = i % 2 === 0 ? '🌷' : '💖';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (7 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 5) + 's';
      bg.appendChild(p);
    }

    let loveValue = 100.0;
    let speed = 4.5;
    const counterEl = document.getElementById('loveCounter');
    const statusEl = document.getElementById('loveStatus');
    const nextBtn = document.getElementById('nextBtn');

    const statuses = [
      { at: 150, text: "Wait... why is the meter bypassing normal limits? 😳" },
      { at: 300, text: "Error 404: Maximum limit not found! 🚀" },
      { at: 500, text: "System Warning: Love for Nida has reached infinity! 🔥" },
      { at: 800, text: "Servers are melting because of how pretty you are 🫠💗" },
      { at: 1200, text: "Okay, it's officially unstoppable now. Deal with it 😎💞" }
    ];

    function updateCounter() {
      loveValue += speed;
      counterEl.textContent = loveValue.toFixed(1) + '%';

      // Check statuses
      for (let s of statuses) {
        if (loveValue >= s.at && loveValue < s.at + speed * 10) {
          statusEl.textContent = s.text;
        }
      }

      // Unlock next page automatically once it passes 500%
      if (loveValue >= 500 && !nextBtn.classList.contains('visible')) {
        nextBtn.classList.add('visible');
      }

      requestAnimationFrame(() => {
        setTimeout(updateCounter, 50);
      });
    }

    function boostLove() {
      speed += 12.0;
      statusEl.textContent = "⚠️ ERROR: Trying to stop it only made Affan love you MORE! 💥😂";
      
      // Floating hearts effect on click
      const h = document.createElement('div');
      h.textContent = '💗';
      h.style.position = 'fixed';
      h.style.left = (Math.random() * 60 + 20) + 'vw';
      h.style.top = '50vh';
      h.style.fontSize = '2rem';
      h.style.transition = 'all 0.8s ease-out';
      h.style.zIndex = '999';
      document.body.appendChild(h);
      setTimeout(() => {
        h.style.transform = 'translateY(-100px) scale(1.5)';
        h.style.opacity = '0';
      }, 50);
      setTimeout(() => h.remove(), 850);
    }

    // Start counter loop
    setTimeout(updateCounter, 600);
  </script>
</body>
                                                                                                                             </html>
